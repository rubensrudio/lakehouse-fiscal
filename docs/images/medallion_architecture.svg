  <rect x="1420" y="260" width="130" height="330" class="box" fill="#16324a" stroke="#60a5fa"/>
  <text x="1485" y="315" text-anchor="middle" class="h">MinIO</text>
  <text x="1485" y="350" text-anchor="middle" class="t">S3A</text>
  <text x="1485" y="405" text-anchor="middle" class="t">bronze/</text>
  <text x="1485" y="440" text-anchor="middle" class="t">silver/</text>
  <text x="1485" y="475" text-anchor="middle" class="t">gold/</text>
