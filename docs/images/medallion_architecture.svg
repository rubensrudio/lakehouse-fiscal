  <path d="M290 375 H370" class="edge"/><path d="M630 315 H710" class="edge"/>
  <path d="M970 315 H1060" class="edge"/><path d="M1205 460 V545" class="edge"/>
  <path d="M505 400 V500" class="edge"/><path d="M630 580 C700 580 680 390 720 360" class="edge"/>
  <path d="M1340 320 H1410" class="edge"/><path d="M970 350 C1110 500 1290 505 1410 470" class="edge"/>
  <path d="M630 270 C900 120 1250 130 1410 325" class="edge"/>

  <text x="800" y="815" text-anchor="middle" class="note">One Python package · profile-aware session/naming/paths · no Databricks account required</text>
