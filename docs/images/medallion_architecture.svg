<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#80cbc4"/>
    </marker>
    <style>
      .title{font:700 42px system-ui,sans-serif;fill:#f7fafc}.sub{font:22px system-ui,sans-serif;fill:#b8c7d9}
      .h{font:700 24px system-ui,sans-serif;fill:#fff}.t{font:18px system-ui,sans-serif;fill:#e6edf5}
      .edge{stroke:#80cbc4;stroke-width:5;fill:none;marker-end:url(#arrow)}
      .box{stroke-width:3;rx:22}.note{font:16px system-ui,sans-serif;fill:#9fb3c8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" class="title">lakehouse-fiscal · MVP architecture</text>
  <text x="800" y="108" text-anchor="middle" class="sub">Reproducible local medallion pipeline · synthetic Brazilian NF-e</text>

  <rect x="60" y="300" width="230" height="150" class="box" fill="#3f2a56" stroke="#c4a7e7"/>
