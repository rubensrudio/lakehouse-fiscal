[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-fiscal"
version = "0.1.0"
description = "A reproducible Brazilian fiscal lakehouse built with Spark and Delta Lake"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
  "delta-spark==3.2.1",
  "faker>=28,<29",
  "psycopg[binary]>=3.2,<4",
  "pyspark==3.5.3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
databricks = ["databricks-connect==16.1.*", "databricks-sdk>=0.40,<1"]

[dependency-groups]
dev = [
  "chispa>=0.10,<1",
  "hatchling>=1.27,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "sqlglot>=26,<27",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_fiscal"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lakehouse_fiscal"]
mypy_path = "src"

[[tool.mypy.overrides]]
# PySpark and Delta expose incomplete runtime-generated typing information.
module = ["pyspark.*", "delta.*", "databricks.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires the local Docker stack",
  "scale10: requires the ten-times synthetic dataset",
]

[tool.coverage.run]
source = ["src/lakehouse_fiscal"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

